<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family &amp; Friends | Lardizabal's Portfolio</title>
  <meta name="description" content="Family and friends of Jd Selwyn G. Lardizabal.">
  <script>
    /* Apply the saved theme before paint so the page doesn't flash */
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" type="image/x-icon" href="Favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="about-page ff-page">
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Home">JSL.</a>

    <nav id="nav" class="nav" aria-label="Main">
      <a href="index.html">Home Page</a>
      <a href="about.html">Personal Info</a>
      <a href="achievements.html">Achievements</a>
      <a href="family-friends.html" aria-current="page">Family &amp; Friends</a>
    </nav>

    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to light mode" aria-pressed="false">
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="menu-toggle" class="icon-btn menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="about">
    <section class="sheet ff-sheet">
      <h1>Family &amp; Friends</h1>
      <p class="ff-note">The people who support me. Click any photo to zoom.</p>

      <div class="ff-group" id="family">
        <h2 class="div-label">Family</h2>
        <div class="ff-row">
          <figure class="shot ff-shot" style="--ar:1.5"><button type="button" data-full="family-dad.jpg" data-cap="Handshake with my dad" aria-label="Click to zoom: Handshake with my dad"><img src="family-dad.jpg" alt="Handshake with my dad"></button><figcaption>Handshake with my dad</figcaption></figure>
          <figure class="shot ff-shot" style="--ar:0.75"><button type="button" data-full="family-mom.jpg" data-cap="Hugging my mom" aria-label="Click to zoom: Hugging my mom"><img src="family-mom.jpg" alt="Hugging my mom"></button><figcaption>Hugging my mom</figcaption></figure>
          <figure class="shot ff-shot" style="--ar:0.75"><button type="button" data-full="family-sibling.jpg" data-cap="Selfie with my sibling" aria-label="Click to zoom: Selfie with my sibling"><img src="family-sibling.jpg" alt="Selfie with my sibling"></button><figcaption>Selfie with my sibling</figcaption></figure>
        </div>
      </div>

      <div class="ff-group" id="friends">
        <h2 class="div-label">Friends</h2>
        <div class="ff-row">
          <figure class="shot ff-shot" style="--ar:1.5"><button type="button" data-full="friends-photobooth.jpg" data-cap="Photobooth fun with a friend" aria-label="Click to zoom: Photobooth fun with a friend"><img src="friends-photobooth.jpg" alt="Photobooth fun with a friend"></button><figcaption>Photobooth fun with a friend</figcaption></figure>
          <figure class="shot ff-shot" style="--ar:0.75"><button type="button" data-full="friends-pines.jpg" data-cap="Hangout with the boys at the pine trees" aria-label="Click to zoom: Hangout with the boys at the pine trees"><img src="friends-pines.jpg" alt="Hangout with the boys at the pine trees"></button><figcaption>Hangout with the boys at the pine trees</figcaption></figure>
          <figure class="shot ff-shot" style="--ar:1.333"><button type="button" data-full="friends-dinner.jpg" data-cap="Dinner out with friends" aria-label="Click to zoom: Dinner out with friends"><img src="friends-dinner.jpg" alt="Dinner out with friends"></button><figcaption>Dinner out with friends</figcaption></figure>
        </div>
      </div>
    </section>
  </main>

  <dialog id="lightbox" class="lightbox" aria-label="Enlarged image">
    <img id="lightbox-img" alt="">
    <p id="lightbox-cap"></p>
  </dialog>

  <footer class="site-footer">
    <p>&copy; <span id="year">2026</span> Jd Selwyn G. Lardizabal</p>
    <a class="btn" href="index.html">Back to Home</a>
  </footer>

  <script src="script.js"></script>
  <script>
    (function () {
      /* Click a photo to see it full size */
      var box = document.getElementById('lightbox');
      var big = document.getElementById('lightbox-img');
      var cap = document.getElementById('lightbox-cap');
      document.querySelectorAll('.shot button').forEach(function (b) {
        b.addEventListener('click', function () {
          big.src = b.dataset.full;
          big.alt = b.querySelector('img').alt;
          cap.textContent = b.dataset.cap;
          box.showModal();
        });
      });
      box.addEventListener('click', function () { box.close(); });
    })();
  </script>
</body>
</html>
